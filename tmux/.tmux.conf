# =============================================================================

# -----------------------------------------------------------------------------
# PREFIXO
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# GERAL
# -----------------------------------------------------------------------------
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g detach-on-destroy off              # ao matar a última sessão, vai pra outra
set -g repeat-time 300
set -g initial-repeat-time 300            # janela do 1º repeat, separada das seguintes
set -g word-separators ' @"=()[]{}:,'     # duplo-clique pega paths/URLs inteiros

# -----------------------------------------------------------------------------
# TERMINAL (Windows Terminal / WSL2)
# -----------------------------------------------------------------------------
set -g default-terminal 'tmux-256color'
set -as terminal-features 'xterm*:RGB:extkeys:usstyle:hyperlinks:sync'

# Teclas estendidas (modifyOtherKeys): faz Shift+Enter / Ctrl+Enter chegarem
# nos apps dentro do pane — necessário pro Claude Code.
set -s extended-keys on

# Clipboard: aceita OSC 52 dos apps e repassa pro terminal.
# Complementa o tmux-yank, que no WSL usa clip.exe.
set -s set-clipboard on

# Deixa sequências OSC de apps aninhados passarem (imagens, OSC 7, OSC 52).
setw -g allow-passthrough on

# -----------------------------------------------------------------------------
# ATALHOS
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "✔ tmux.conf recarregado!"
bind c new-window -c "#{pane_current_path}"
bind Space last-pane
bind a last-window
bind b break-pane
bind @ choose-tree -Zw "join-pane -t '%%'"
bind S setw synchronize-panes \; display "sync: #{?pane_synchronized,ON,OFF}"

# -----------------------------------------------------------------------------
# POPUPS
# -----------------------------------------------------------------------------
bind g display-popup -E -d "#{pane_current_path}" -w 85% -h 85%
bind s display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='sessão' | xargs -r tmux switch-client -t"
bind C-t display-popup -E -w 80% -h 80% htop

# -----------------------------------------------------------------------------
# NAVEGAÇÃO ENTRE JANELAS
# -----------------------------------------------------------------------------
bind -r p previous-window
bind -r n next-window

# -----------------------------------------------------------------------------
# MODO CÓPIA (estilo Vim)
# -----------------------------------------------------------------------------
setw -g mode-keys vi
setw -g copy-mode-line-numbers hybrid     # linha atual absoluta, demais relativas

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# C-v (rectangle-toggle) já é default; y / Y / seleção por mouse são
# reconfigurados pelo tmux-yank para o clipboard do Windows via clip.exe.

# -----------------------------------------------------------------------------
# STATUS BAR
# -----------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60
setw -g window-status-format " #I:#W "

# -----------------------------------------------------------------------------
# PAINÉIS
# -----------------------------------------------------------------------------
set -g display-panes-time 2000
setw -g pane-scrollbars modal              # scrollbar só em copy-mode/view-mode
setw -g pane-scrollbars-position right
setw -g pane-border-lines heavy            # 'rounded' não existe aqui (só em popup/menu)
setw -g pane-border-indicators both
setw -g pane-border-format ' #P #{pane_current_command} '

# Borda com título só quando há mais de um pane
set-hook -g after-split-window 'setw pane-border-status top'
set-hook -g pane-exited 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off"'

# -----------------------------------------------------------------------------
# MENSAGENS E ALERTAS
# -----------------------------------------------------------------------------
set -g display-time 2000
set -g monitor-activity on
set -g visual-activity off
set -g popup-border-lines rounded
setw -g menu-border-lines rounded
setw -g mode-style 'bg=colour61,fg=colour255'

# =============================================================================
# PLUGINS (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'       # must be after resurrect

# Dracula status bar
set -g @dracula-plugins 'git battery cpu-usage ram-usage continuum cwd time custom:claude_usage.sh custom:claude_weekly.sh'
set -g @dracula-custom-plugin-colors "cyan dark_gray"
set -g @dracula-show-powerline true
set -g @dracula-military-time true
set -g @dracula-border-contrast true
set -g @dracula-show-left-icon '#S#{?pane_in_mode, ⧉,}'
set -g @dracula-cpu-usage-label 'CPU'
set -g @dracula-ram-usage-label 'RAM'
set -g @dracula-ram-usage-colors "pink dark_gray"
set -g @dracula-show-flags true
set -g @dracula-show-empty-plugins false
set -g @dracula-refresh-rate 5

# Resurrect: salva conteúdo dos panes e sessões do vim
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# Continuum: auto-save a cada 15 min, auto-restore ao iniciar o tmux
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Cmatrix screen lock after 5 min of inactivity
set -g lock-command 'cmatrix -ba -u -C magenta'
set -g lock-after-time 300
